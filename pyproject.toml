[project]
name = "support-bot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "chromadb>=1.5.9",
    "fastapi>=0.158.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "slack-bolt>=1.30.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
