# Paste this at api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: Support Bot
  description: Answers questions from our help articles, in plain language.
  background_color: "#2c2d30"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Support Bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      # Read the thread so follow-ups keep the conversation, also after a restart.
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      # Follow-ups in the bot's threads without an @mention.
      - message.channels
      - message.groups
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
